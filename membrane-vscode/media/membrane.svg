<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Activity bar icon representing a membrane structure -->
  <!-- Outer circle (membrane boundary) -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#1e90ff" stroke-width="2"/>

  <!-- Inner nodes (entities) -->
  <circle cx="16" cy="8" r="2" fill="#1e90ff"/>
  <circle cx="24" cy="16" r="2" fill="#1e90ff"/>
  <circle cx="16" cy="24" r="2" fill="#1e90ff"/>
  <circle cx="8" cy="16" r="2" fill="#1e90ff"/>
  <circle cx="20" cy="12" r="2" fill="#1e90ff"/>
  <circle cx="20" cy="20" r="2" fill="#1e90ff"/>
  <circle cx="12" cy="20" r="2" fill="#1e90ff"/>
  <circle cx="12" cy="12" r="2" fill="#1e90ff"/>

  <!-- Hub node (larger) -->
  <circle cx="16" cy="16" r="3.5" fill="#ff6b6b"/>

  <!-- Connections (edges) -->
  <line x1="16" y1="8" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="16" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="16" y1="24" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="8" y1="16" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="12" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="20" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="12" y1="20" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
  <line x1="12" y1="12" x2="16" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.6"/>
</svg>
