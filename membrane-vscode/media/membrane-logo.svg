<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="#f8f9fa" rx="8"/>

  <!-- Outer circle (membrane boundary) -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#grad1)" stroke-width="3"/>

  <!-- Grid of nodes -->
  <g fill="#1e90ff">
    <!-- Top row -->
    <circle cx="64" cy="24" r="4" />
    <circle cx="48" cy="32" r="4" />
    <circle cx="80" cy="32" r="4" />

    <!-- Middle row -->
    <circle cx="32" cy="64" r="4" />
    <circle cx="96" cy="64" r="4" />
    <circle cx="40" cy="48" r="4" />
    <circle cx="88" cy="48" r="4" />
    <circle cx="40" cy="80" r="4" />
    <circle cx="88" cy="80" r="4" />

    <!-- Bottom row -->
    <circle cx="48" cy="96" r="4" />
    <circle cx="80" cy="96" r="4" />
    <circle cx="64" cy="104" r="4" />
  </g>

  <!-- Hub node (larger, red) -->
  <circle cx="64" cy="64" r="8" fill="#ff6b6b" opacity="0.9"/>

  <!-- Connections -->
  <g stroke="#4a9eff" stroke-width="1.5" opacity="0.4">
    <line x1="64" y1="24" x2="64" y2="64" />
    <line x1="48" y1="32" x2="64" y2="64" />
    <line x1="80" y1="32" x2="64" y2="64" />
    <line x1="32" y1="64" x2="64" y2="64" />
    <line x1="96" y1="64" x2="64" y2="64" />
    <line x1="40" y1="48" x2="64" y2="64" />
    <line x1="88" y1="48" x2="64" y2="64" />
    <line x1="40" y1="80" x2="64" y2="64" />
    <line x1="88" y1="80" x2="64" y2="64" />
    <line x1="48" y1="96" x2="64" y2="64" />
    <line x1="80" y1="96" x2="64" y2="64" />
    <line x1="64" y1="104" x2="64" y2="64" />
  </g>

  <!-- Text label -->
  <text x="64" y="120" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#0066cc">MEMBRANE</text>
</svg>
